[project]
name = "tts-python-metal"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
   "huggingface_hub",
   "pydantic",
   "sentencepiece",
   "safetensors",
]

[project.optional-dependencies]
# MPS (PyTorch Metal) backend - uses moshi fork with scatter_ fix
mps = [
   "julius",
   "moshi @ git+https://github.com/ochafik/moshi.git@apple-silicon-tts#subdirectory=moshi",
]
# MLX (Apple native) backend - uses moshi_mlx from fork
mlx = [
   "mlx",
   "mlx-lm",
   "sphn",
   "moshi_mlx @ git+https://github.com/ochafik/moshi.git@apple-silicon-tts#subdirectory=moshi_mlx",
]

[tool.uv]
# Skip building xformers which requires torch at build time
no-build-isolation-package = []
