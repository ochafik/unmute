static_dir = "./static/"
log_dir = "/tmp/unmute_logs"
instance_name = "tts_mlx"
authorized_ids = ["public_token"]

[modules.tts_py]
type = "Py"
path = "/api/tts_streaming"
text_tokenizer_file = "hf://kyutai/tts-1.6b-en_fr/tokenizer_spm_8k_en_fr_audio.model"
# MLX is single-threaded per batch, so batch_size=1 is optimal
batch_size = 1
text_bos_token = 1
# Use the MLX TTS script instead of the PyTorch one
script = "/Users/ochafik/github/moshi/rust/moshi-server/tts_mlx.py"

[modules.tts_py.py]
log_folder = "/tmp/unmute_logs"
voice_folder = "hf-snapshot://kyutai/tts-voices/**/*.safetensors"
default_voice = "unmute-prod-website/default_voice.wav"
cfg_coef = 2.0
padding_between = 1
n_q = 24
debug = false
# Enable 8-bit quantization for ~30-50% speedup (can also try 4 for max speed)
quantize = 8
